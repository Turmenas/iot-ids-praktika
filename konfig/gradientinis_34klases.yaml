# XGBoost, 34 KLASIU formuluote - tik palyginimui su literatura.
#
# Hiperparametrai TIE PATYS kaip gradientinis_derintas.yaml: derinimas
# atliktas 8 kategoriju uzduociai, ir perderinti kiekvienai formuluotei
# atskirai reikstu lyginti su literatura kitokiu modeliu.
#
# `almahaqeri2026gradient` ta paciam CICIoT2023 skelbia:
#   dvejetaine  99,61 % tikslumo, macro-F1 0,9952
#   8 kategor.  99,59 %,           macro-F1 0,8903
#   34 klases   99,48 %,           macro-F1 0,8876
modelis: gradientinis
formuluote: 34klases

hiperparametrai:
  n_estimators: 800
  max_depth: 10
  learning_rate: 0.1
  subsample: 0.6
  colsample_bytree: 0.6
  min_child_weight: 5
  tree_method: hist
  device: cuda
  n_jobs: -1

smote: false

# DEMESIO: XGBoost daugiaklasej uzduotyje augina n_estimators x n_klasiu
# medziu. Prie 34 klasiu tai 27 200 medziu vietoj 6 400, todel mokymas ir
# modelio dydis auga maždaug keturis kartus, palyginti su 8 kategorijomis.
