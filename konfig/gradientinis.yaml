# XGBoost - sprendimu matricos virsune (4,70).
# Vienintelis modelis, kurio rezultata galima gretinti su almahaqeri2026gradient.
modelis: gradientinis
formuluote: 8kat

hiperparametrai:
  n_estimators: 300
  max_depth: 8
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  # hist - vienintelis budas, telpantis i 30 min. biudzeta prie 1,7 mln. eiluciu
  tree_method: hist
  # GPU (RTX 4060). Masinoje be CUDA automatiskai grizta i cpu su pranesimu.
  device: cuda
  n_jobs: -1

smote: false
